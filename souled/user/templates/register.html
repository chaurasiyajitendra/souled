{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>

    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="left">
        <h1>Create Account</h1>
        <p>Join ShopKart and enjoy shopping.</p>
      </div>

      <div class="right">
        <h2>Register</h2>
        {% if error %}

          <div class="error-message">
              <i class="fa-solid fa-circle-exclamation"></i>
              <span>{{ error }}</span>
          </div>

        {% endif %}

        <form method="post" action="{% url 'register' %}">
          {% csrf_token %}

          <div class="input-box">
            <i class="fa-solid fa-user"></i>
            <input required type="text" name="name" placeholder="Full Name" />
          </div>

          <div class="input-box">
            <i class="fa-solid fa-user"></i>
            <input minlength="3" required type="text" name="username" placeholder="Username" />
          </div>

          <div class="input-box">
            <i class="fa-solid fa-envelope"></i>
            <input required type="email" name="email" placeholder="Email" />
          </div>

          <div class="input-box">
            <i class="fa-solid fa-phone"></i>
            <input minlength="10" maxlength="13" required type="text" name="phone" placeholder="Phone" />
          </div>

          <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input required type="password" name="password" placeholder="Password" />
          </div>

          <button>Create Account</button>

          <p>
            Already have an account?
            <a href="/login/">Login</a>
          </p>
        </form>
      </div>
    </div>
  </body>
</html>
